name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-only: true
      - run: make check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach installer
        run: gh release upload "$GITHUB_REF_NAME" scripts/install.sh --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  install-smoke:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Install the released version on a fresh Ubuntu VM
        run: |
          curl -fsSLO "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/install.sh"
          sudo sh install.sh --version "$GITHUB_REF_NAME" --systemd --no-doctor
          arcana version
          systemd-analyze verify /etc/systemd/system/arcana.service
