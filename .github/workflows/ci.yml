name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - run: make check
      - run: CGO_ENABLED=0 make build
      - run: ./bin/arcana version
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/install.sh deploy/packaging/postinstall.sh
  markdown:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable pnpm
      - name: Install Python SDK with the pinned generator
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -e "sdk/python[dev]"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Generated SDK code is current
        run: make sdk-verify-generated
      - name: Build the sandbox template image
        run: docker build -t arcana-base:local templates/base
      - name: Test both SDKs against a live Arcana (runc; the runsc suites are in the security job)
        run: make sdk-test PYTHON=python
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - name: Lint, typecheck, unit tests, generated types, bundle budget
        run: make web-check
      - name: Build Arcana with the dashboard embedded
        run: make build-all
      - run: go test ./internal/webui/...
      - name: Install the browser for the smoke test
        run: cd web && pnpm exec playwright install --with-deps chromium
      - name: Build the sandbox template image
        run: docker build -t arcana-base:local templates/base
      - name: Playwright smoke test against a live Arcana (runc), checking for CSP violations
        run: make web-e2e
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARCANA_REQUIRE_RUNSC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gVisor from the official apt repository
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo "$(command -v runsc)" install
          sudo systemctl restart docker
          docker info
      - name: Follow README quickstart on the fresh Ubuntu VM
        shell: bash
        run: |
          set -o pipefail
          if ! python3 scripts/check_quickstart.py 2>&1 | tee quickstart.log; then
            tail -50 quickstart.log | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              echo "::error title=README quickstart failure::$line"
            done
            exit 1
          fi
      - run: make templates proxy-image
      - name: Run integration and escape suites v1/v2 (ESC-01 through ESC-20) with runsc
        shell: bash
        run: |
          set -o pipefail
          if ! make test-integration test-escape 2>&1 | tee security-tests.log; then
            grep -E -A8 -B2 -- '^--- FAIL:|^FAIL|panic:|fatal error:|Error [0-9]|:[0-9]+:[0-9]+:' security-tests.log | head -80 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              echo "::error title=Security test failure::$line"
            done
            exit 1
          fi
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          args: --build-tags=escape ./test/escape/...
