apiVersion: v1
kind: Pod
metadata:
  name: {{ include "arcana.fullname" . }}-test
  labels:
    {{- include "arcana.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: busybox:1.37
      command: ["wget", "-q", "-O", "-", "http://{{ include "arcana.fullname" . }}:{{ .Values.service.port }}/v1/health"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
