apiVersion: v1
kind: Service
metadata:
  name: {{ include "arcana.fullname" . }}
  labels:
    {{- include "arcana.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "arcana.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.service.port }}
      targetPort: api
    {{- if .Values.service.metrics.enabled }}
    - name: metrics
      port: {{ .Values.service.metrics.port }}
      targetPort: metrics
    {{- end }}
