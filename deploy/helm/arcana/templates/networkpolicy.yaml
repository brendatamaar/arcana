{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.allowFrom }}
{{- fail "networkPolicy.allowFrom must list the peers allowed to reach Arcana" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arcana.fullname" . }}
  labels:
    {{- include "arcana.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "arcana.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.allowFrom | nindent 8 }}
      ports:
        - port: 7070
        {{- if .Values.service.metrics.enabled }}
        - port: 9090
        {{- end }}
{{- end }}
