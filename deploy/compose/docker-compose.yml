services:
  arcana:
    image: arcana:local
    command: [serve, --config, /etc/arcana/config.yaml]
    user: "${ARCANA_UID:-1000}:${ARCANA_GID:-1000}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    read_only: true
    group_add: ["${DOCKER_GID:?Set DOCKER_GID from the Docker socket group}"]
    environment:
      ARCANA_DATA_DIR: ${ARCANA_DATA_DIR:?Set an absolute host data directory}
    volumes:
      - ${ARCANA_DATA_DIR}:${ARCANA_DATA_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
      - ./arcana.yaml:/etc/arcana/config.yaml:ro
    ports: ["127.0.0.1:${ARCANA_API_PORT:-7070}:7070"]
    tmpfs: [/tmp:size=64m]
    logging:
      driver: none
  prometheus:
    image: prom/prometheus@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"]
  grafana:
    image: grafana/grafana@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/arcana.json:/var/lib/grafana/dashboards/arcana.json:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
volumes:
  prometheus:
  grafana:
