components:
  responses:
    Error:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: API error
  schemas:
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, ts, key_id, sandbox_id, action, details]
      properties:
        id:
          type: string
        ts:
          type: string
          format: date-time
        key_id:
          type: string
        sandbox_id:
          type: string
        action:
          type: string
        details:
          type: object
          additionalProperties: true
    AuditList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: string
          nullable: true
    Snapshot:
      type: object
      additionalProperties: false
      required: [id, source_sandbox_id, template, resources, network, env_keys, size_bytes, sha256, created_at]
      description: Compressed copy of a sandbox's /workspace plus its creation spec. Environment values are never stored.
      properties:
        id:
          type: string
        source_sandbox_id:
          type: string
        template:
          type: string
        resources:
          $ref: '#/components/schemas/Resources'
        network:
          $ref: '#/components/schemas/Network'
        env_keys:
          type: array
          maxItems: 100
          items:
            type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        created_at:
          type: string
          format: date-time
    SnapshotList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Snapshot'
        next_cursor:
          type: string
          nullable: true
    ForkRequest:
      type: object
      additionalProperties: false
      required: [count]
      description: Overrides apply to every sandbox created by the fork.
      properties:
        count:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000
        ttl_seconds:
          type: integer
          format: int64
          minimum: 1
        idle_timeout_seconds:
          type: integer
          format: int64
          minimum: 1
        resources:
          $ref: '#/components/schemas/Resources'
        network:
          $ref: '#/components/schemas/Network'
        env:
          type: object
          maxProperties: 100
          additionalProperties:
            type: string
        labels:
          type: object
          maxProperties: 100
          additionalProperties:
            type: string
    ForkFailure:
      type: object
      additionalProperties: false
      required: [index, code, message]
      properties:
        index:
          type: integer
          format: int64
          minimum: 0
          description: Zero-based position of the failed sandbox in the request.
        code:
          type: string
        message:
          type: string
    ForkResult:
      type: object
      additionalProperties: false
      required: [items, failures]
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Sandbox'
        failures:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ForkFailure'
    StateChange:
      type: object
      additionalProperties: false
      required: [state, at]
      properties:
        state:
          $ref: '#/components/schemas/SandboxState'
        at:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
    StateHistory:
      type: object
      additionalProperties: false
      required: [items]
      description: A sandbox's persisted state transitions in order, with the reason where one was recorded.
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/StateChange'
    Session:
      type: object
      additionalProperties: false
      required: [id, expires_at]
      description: A dashboard browser session. Its token is delivered only as an HttpOnly cookie.
      properties:
        id:
          type: string
        expires_at:
          type: string
          format: date-time
    ExecRecord:
      type: object
      additionalProperties: false
      required: [id, sandbox_id, cwd, tty, started_at, cancelled]
      description: Metadata of one exec. Output is never stored; see the exec output stream.
      properties:
        id:
          type: string
        sandbox_id:
          type: string
        cmd:
          type: array
          nullable: true
          items:
            type: string
          description: argv when the exec was given as an array.
        shell:
          type: string
          nullable: true
          description: The shell string when the exec used the shell field.
        cwd:
          type: string
        tty:
          type: boolean
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        exit_code:
          type: integer
          nullable: true
          description: The command's real exit status; null while running or when it could not be confirmed.
        timed_out:
          type: boolean
          nullable: true
        cancelled:
          type: boolean
        truncated:
          type: boolean
          nullable: true
        stdout_bytes:
          type: integer
          format: int64
          nullable: true
        stderr_bytes:
          type: integer
          format: int64
          nullable: true
    ExecList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ExecRecord'
        next_cursor:
          type: string
          nullable: true
    TemplateCount:
      type: object
      additionalProperties: false
      required: [template, count]
      properties:
        template:
          type: string
        count:
          type: integer
          format: int64
    PoolFill:
      type: object
      additionalProperties: false
      required: [template, available, target]
      properties:
        template:
          type: string
        available:
          type: integer
          format: int64
        target:
          type: integer
          format: int64
    Termination:
      type: object
      additionalProperties: false
      required: [id, template, state, ended_at]
      properties:
        id:
          type: string
        template:
          type: string
        state:
          $ref: '#/components/schemas/SandboxState'
        reason:
          type: string
          nullable: true
        ended_at:
          type: string
          format: date-time
    Overview:
      type: object
      additionalProperties: false
      required: [version, runtime, sandboxes_by_template, pool, recent_terminations]
      description: Admin keys see installation-wide numbers; other keys see their own, and no pool fill.
      properties:
        version:
          type: string
        runtime:
          type: string
        sandboxes_by_template:
          type: array
          items:
            $ref: '#/components/schemas/TemplateCount'
        pool:
          type: array
          items:
            $ref: '#/components/schemas/PoolFill'
        recent_terminations:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Termination'
    Template:
      type: object
      additionalProperties: false
      required: [name, image, resources, ttl_seconds, idle_timeout_seconds, workdir, network_mode, warm_pool, env_keys]
      properties:
        network_preset:
          type: string
        name:
          type: string
        image:
          type: string
        resources:
          $ref: '#/components/schemas/Resources'
        ttl_seconds:
          type: integer
          format: int64
        idle_timeout_seconds:
          type: integer
          format: int64
        workdir:
          type: string
        network_mode:
          type: string
        warm_pool:
          type: integer
        env_keys:
          type: array
          items:
            type: string
    TemplateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Template'
    CreateKey:
      additionalProperties: false
      properties:
        is_admin:
          type: boolean
        name:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - name
      type: object
    CreateSandbox:
      additionalProperties: false
      properties:
        env:
          additionalProperties:
            type: string
          maxProperties: 100
          type: object
        from_snapshot:
          description: >-
            Snapshot to restore into /workspace. The template must match the snapshot's template;
            resources and network default to the snapshot's recorded values.
          maxLength: 128
          nullable: true
          type: string
        idle_timeout_seconds:
          format: int64
          minimum: 1
          type: integer
        labels:
          additionalProperties:
            type: string
          maxProperties: 100
          type: object
        network:
          $ref: '#/components/schemas/Network'
        resources:
          $ref: '#/components/schemas/Resources'
        template:
          maxLength: 128
          minLength: 1
          type: string
        ttl_seconds:
          format: int64
          minimum: 1
          type: integer
      required:
        - template
      type: object
    CreatedKey:
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/Key'
        secret:
          type: string
      required:
        - key
        - secret
      type: object
    Error:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              enum:
                - invalid_request
                - invalid_path
                - invalid_template
                - unauthorized
                - forbidden
                - sandbox_not_found
                - snapshot_not_found
                - file_not_found
                - key_not_found
                - sandbox_not_running
                - exec_limit_reached
                - payload_too_large
                - quota_exceeded
                - rate_limited
                - internal
                - runtime_unavailable
                - shutting_down
              type: string
            message:
              type: string
            request_id:
              type: string
          required:
            - code
            - message
            - request_id
          type: object
      required:
        - error
      type: object
    ExecRequest:
      additionalProperties: false
      oneOf:
        - not:
            required:
              - shell
          required:
            - cmd
        - not:
            required:
              - cmd
          required:
            - shell
      properties:
        cmd:
          items:
            type: string
          maxItems: 256
          minItems: 1
          type: array
        cwd:
          type: string
        env:
          additionalProperties:
            type: string
          maxProperties: 100
          type: object
        shell:
          minLength: 1
          type: string
        stdin:
          format: byte
          type: string
        timeout_seconds:
          format: int64
          minimum: 1
          type: integer
      type: object
    ExecResult:
      additionalProperties: false
      properties:
        duration_ms:
          format: int64
          minimum: 0
          type: integer
        exec_id:
          type: string
        exit_code:
          type: integer
        stderr:
          type: string
        stdout:
          type: string
        timed_out:
          type: boolean
        truncated:
          type: boolean
      required:
        - exec_id
        - exit_code
        - stdout
        - stderr
        - duration_ms
        - timed_out
        - truncated
      type: object
    FileEntry:
      additionalProperties: false
      properties:
        mode:
          format: int64
          minimum: 0
          type: integer
        modified_at:
          format: date-time
          type: string
        name:
          type: string
        path:
          type: string
        size_bytes:
          format: int64
          minimum: 0
          type: integer
        type:
          enum:
            - file
            - directory
            - symlink
            - other
          type: string
      required:
        - name
        - path
        - type
        - size_bytes
      type: object
    FileList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/FileEntry'
          type: array
      required:
        - items
      type: object
    Health:
      additionalProperties: false
      properties:
        status:
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    Key:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        is_admin:
          type: boolean
        name:
          type: string
        prefix:
          maxLength: 8
          minLength: 8
          type: string
        revoked_at:
          format: date-time
          nullable: true
          type: string
      required:
        - id
        - name
        - prefix
        - is_admin
        - created_at
      type: object
    KeyList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Key'
          type: array
        next_cursor:
          nullable: true
          type: string
      required:
        - items
      type: object
    Network:
      additionalProperties: false
      properties:
        allow:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 253
        presets:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 128
        mode:
          enum:
            - none
            - allowlist
          type: string
      required:
        - mode
      type: object
    Resources:
      additionalProperties: false
      properties:
        cpus:
          exclusiveMinimum: true
          minimum: 0
          type: number
        disk_mb:
          format: int64
          minimum: 1
          type: integer
        memory_mb:
          format: int64
          minimum: 1
          type: integer
        pids:
          format: int64
          minimum: 1
          type: integer
      type: object
    Sandbox:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        end_reason:
          nullable: true
          type: string
        ended_at:
          format: date-time
          nullable: true
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        idle_timeout_seconds:
          format: int64
          minimum: 0
          type: integer
        labels:
          additionalProperties:
            type: string
          maxProperties: 100
          type: object
        last_activity_at:
          format: date-time
          type: string
        network:
          $ref: '#/components/schemas/Network'
        resources:
          $ref: '#/components/schemas/Resources'
        runtime:
          type: string
        source:
          enum:
            - cold
            - pool
            - snapshot
          type: string
        state:
          $ref: '#/components/schemas/SandboxState'
        template:
          type: string
      required:
        - id
        - state
        - template
        - runtime
        - source
        - resources
        - network
        - labels
        - created_at
        - expires_at
      type: object
    SandboxList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Sandbox'
          type: array
        next_cursor:
          nullable: true
          type: string
      required:
        - items
      type: object
    SandboxState:
      enum:
        - creating
        - running
        - destroying
        - destroyed
        - failed
        - expired
      type: string
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
    cookieAuth:
      type: apiKey
      in: cookie
      name: arcana_session
      description: >-
        Dashboard session cookie (HttpOnly, SameSite=Strict). It authorizes only GET and HEAD requests
        and DELETE /v1/sessions/current, and only for requests that carry an Origin matching this
        server or ui.allowed_origins (or, for GET, Sec-Fetch-Site: same-origin). Any other request
        authenticated only by the cookie is rejected with 403 forbidden.
info:
  title: Arcana API
  version: 0.1.0
openapi: 3.0.3
paths:
  /v1/audit:
    get:
      operationId: listAudit
      summary: Query audit events (admin only)
      parameters:
        - in: query
          name: sandbox_id
          schema: {type: string, maxLength: 128}
        - in: query
          name: key_id
          schema: {type: string, maxLength: 128}
        - in: query
          name: action
          schema: {type: string, maxLength: 128}
        - in: query
          name: since
          schema: {type: string, format: date-time}
        - in: query
          name: until
          schema: {type: string, format: date-time}
        - in: query
          name: cursor
          schema: {type: string, maxLength: 512}
        - in: query
          name: limit
          schema: {type: integer, format: int64, minimum: 1, maximum: 1000}
      responses:
        '200':
          description: Filtered audit page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditList'}
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/sandboxes/{id}/snapshots:
    post:
      operationId: createSnapshot
      summary: Snapshot a running sandbox's /workspace
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
          description: Snapshot stored
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "429":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
        "501":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
  /v1/snapshots:
    get:
      operationId: listSnapshots
      summary: List snapshots visible to the key
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            default: 100
            format: int64
            maximum: 1000
            minimum: 1
            type: integer
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotList'
          description: Success
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "429":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
        "501":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
  /v1/snapshots/{id}:
    get:
      operationId: getSnapshot
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
          description: Success
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "429":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
        "501":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteSnapshot
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Success
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "429":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
        "501":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
  /v1/snapshots/{id}/fork:
    post:
      operationId: forkSnapshot
      summary: Create N sandboxes from one snapshot
      description: >-
        Returns 201 when at least one sandbox was created; failures lists the others.
        When none could be created the response is the error of the first failure.
        Each requested sandbox consumes one sandbox-creation rate-limit token (at most the per-minute rate).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForkResult'
          description: At least one sandbox created
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "429":
          description: Sandbox quota or creation rate exceeded
          headers:
            Retry-After:
              description: Seconds until retry; supplied for rate_limited responses
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          $ref: '#/components/responses/Error'
        "501":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
  /v1/sessions:
    post:
      operationId: createSession
      summary: Exchange the API key for a dashboard session cookie
      description: >-
        Authenticated with an API key (Authorization header); a cookie cannot create sessions. The
        response sets the session token as an HttpOnly, SameSite=Strict cookie, Secure unless the
        request is plain HTTP to a loopback address. Only the token's SHA-256 is stored. Sessions
        expire after ui.session_ttl_seconds and stop working when the key is revoked. Each key keeps at
        most 20 sessions.
      responses:
        "201":
          description: Session created
          headers:
            Set-Cookie:
              description: arcana_session=<token>
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "429":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
        "501":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
  /v1/sessions/current:
    delete:
      operationId: deleteCurrentSession
      summary: Log out of the dashboard
      description: Ends the session identified by the cookie and clears it. Idempotent.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: Logged out
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "429":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
        "501":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
  /v1/events:
    get:
      operationId: streamEvents
      summary: Server-Sent Events stream of lifecycle, exec and pool events
      description: >-
        Events carry increasing IDs; reconnect with Last-Event-ID to resume from the last
        ui.event_buffer events. A client that cannot be resumed, or falls too far behind, receives a
        `reset` event and is disconnected and must refetch state. A comment line is sent every 15 seconds.
        Events are filtered to what the caller may see; pool events are admin-only. Types:
        sandbox.created, sandbox.state, sandbox.destroyed, exec.started, exec.ended, pool.changed.
        Metadata only; exec output is never included. See docs/events.md.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: header
          name: Last-Event-ID
          required: false
          schema:
            type: string
            maxLength: 20
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
