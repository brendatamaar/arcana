        "500":
          $ref: '#/components/responses/Error'
        "501":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
      security: []
  /v1/keys:
    get:
      operationId: listKeys
      parameters:
