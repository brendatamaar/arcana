        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "413":
          $ref: '#/components/responses/Error'
        "429":
          $ref: '#/components/responses/Error'
        "500":
          $ref: '#/components/responses/Error'
        "501":
          $ref: '#/components/responses/Error'
        "503":
          $ref: '#/components/responses/Error'
  /v1/keys/{id}:
