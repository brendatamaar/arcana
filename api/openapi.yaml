  /v1/sandboxes/{id}/execs/{exec_id}/output:
    get:
      operationId: streamExecOutput
      summary: Server-Sent Events tail of an exec's buffered and live output
      description: >-
        Replays the in-memory ring (limits.exec.tail_buffer_bytes), then streams live output until the
        exec ends. `output` events carry {seq, stream, data} with base64 data; `gap` means older output
        was discarded; `end` carries the exit result, with expired=true when the output is no longer
        retained (tail_retention_seconds after the exec ended). Output is never persisted. At most
        limits.exec.max_tail_subscribers readers per exec.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: exec_id
          required: true
          schema:
            type: string
      responses:
