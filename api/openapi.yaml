components:
  responses:
    Error:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: API error
  schemas:
    Template:
      type: object
      additionalProperties: false
      required: [name, image, resources, ttl_seconds, idle_timeout_seconds, workdir, network_mode, warm_pool, env_keys]
      properties:
        name:
          type: string
        image:
          type: string
        resources:
          $ref: '#/components/schemas/Resources'
        ttl_seconds:
          type: integer
          format: int64
        idle_timeout_seconds:
          type: integer
          format: int64
        workdir:
          type: string
        network_mode:
          type: string
        warm_pool:
          type: integer
        env_keys:
          type: array
          items:
            type: string
    TemplateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Template'
    CreateKey:
      additionalProperties: false
      properties:
        is_admin:
          type: boolean
        name:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - name
      type: object
    CreateSandbox:
      additionalProperties: false
      properties:
        env:
          additionalProperties:
            type: string
          maxProperties: 100
          type: object
        idle_timeout_seconds:
          format: int64
          minimum: 1
          type: integer
        labels:
          additionalProperties:
            type: string
          maxProperties: 100
          type: object
        network:
          $ref: '#/components/schemas/Network'
        resources:
          $ref: '#/components/schemas/Resources'
        template:
          maxLength: 128
          minLength: 1
          type: string
        ttl_seconds:
          format: int64
          minimum: 1
          type: integer
      required:
        - template
      type: object
    CreatedKey:
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/Key'
        secret:
          type: string
      required:
        - key
        - secret
      type: object
    Error:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              enum:
                - invalid_request
                - invalid_path
                - invalid_template
                - unauthorized
                - forbidden
                - sandbox_not_found
                - snapshot_not_found
                - file_not_found
                - key_not_found
                - sandbox_not_running
                - exec_limit_reached
                - payload_too_large
                - quota_exceeded
                - rate_limited
                - internal
                - runtime_unavailable
                - shutting_down
              type: string
            message:
              type: string
            request_id:
              type: string
          required:
            - code
            - message
            - request_id
          type: object
      required:
        - error
      type: object
    ExecRequest:
      additionalProperties: false
      oneOf:
        - not:
            required:
              - shell
          required:
            - cmd
        - not:
            required:
              - cmd
          required:
            - shell
      properties:
        cmd:
          items:
            type: string
          maxItems: 256
          minItems: 1
          type: array
        cwd:
          type: string
        env:
          additionalProperties:
            type: string
          maxProperties: 100
          type: object
        shell:
          minLength: 1
          type: string
        stdin:
          format: byte
          type: string
        timeout_seconds:
          format: int64
          minimum: 1
          type: integer
      type: object
    ExecResult:
      additionalProperties: false
      properties:
        duration_ms:
          format: int64
          minimum: 0
          type: integer
        exec_id:
          type: string
        exit_code:
          type: integer
        stderr:
          type: string
        stdout:
          type: string
        timed_out:
          type: boolean
        truncated:
          type: boolean
      required:
        - exec_id
        - exit_code
        - stdout
        - stderr
        - duration_ms
        - timed_out
        - truncated
      type: object
    FileEntry:
      additionalProperties: false
      properties:
        mode:
          format: int64
          minimum: 0
          type: integer
        modified_at:
          format: date-time
          type: string
        name:
          type: string
        path:
          type: string
        size_bytes:
          format: int64
          minimum: 0
          type: integer
        type:
          enum:
            - file
            - directory
            - symlink
            - other
          type: string
      required:
        - name
        - path
        - type
        - size_bytes
      type: object
    FileList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/FileEntry'
          type: array
      required:
        - items
      type: object
    Health:
      additionalProperties: false
      properties:
        status:
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    Key:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        is_admin:
          type: boolean
        name:
          type: string
        prefix:
          maxLength: 8
          minLength: 8
          type: string
        revoked_at:
          format: date-time
          nullable: true
          type: string
      required:
        - id
        - name
        - prefix
        - is_admin
        - created_at
      type: object
    KeyList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Key'
          type: array
        next_cursor:
          nullable: true
          type: string
      required:
        - items
      type: object
    Network:
      additionalProperties: false
      properties:
        mode:
          enum:
            - none
          type: string
      required:
        - mode
      type: object
    Resources:
      additionalProperties: false
      properties:
        cpus:
          exclusiveMinimum: true
          minimum: 0
          type: number
        disk_mb:
          format: int64
          minimum: 1
          type: integer
        memory_mb:
          format: int64
          minimum: 1
          type: integer
        pids:
          format: int64
          minimum: 1
          type: integer
      type: object
    Sandbox:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        end_reason:
          nullable: true
          type: string
        ended_at:
          format: date-time
          nullable: true
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          type: string
        idle_timeout_seconds:
          format: int64
          minimum: 0
          type: integer
        labels:
          additionalProperties:
            type: string
          maxProperties: 100
          type: object
        last_activity_at:
          format: date-time
          type: string
        network:
          $ref: '#/components/schemas/Network'
        resources:
          $ref: '#/components/schemas/Resources'
        runtime:
          type: string
        source:
          enum:
            - cold
            - pool
            - snapshot
          type: string
        state:
          $ref: '#/components/schemas/SandboxState'
        template:
          type: string
      required:
        - id
        - state
        - template
        - runtime
        - source
        - resources
        - network
        - labels
        - created_at
        - expires_at
      type: object
    SandboxList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Sandbox'
          type: array
        next_cursor:
          nullable: true
          type: string
      required:
        - items
      type: object
    SandboxState:
      enum:
        - creating
        - running
        - destroying
        - destroyed
        - failed
        - expired
      type: string
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
info:
  title: Arcana API
  version: 0.1.0
openapi: 3.0.3
paths:
  /v1/templates:
    get:
      operationId: listTemplates
      summary: List configured templates and resolved defaults (environment keys only)
      responses:
        '200':
          description: Configured templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateList'
        '401':
          $ref: '#/components/responses/Error'
  /v1/health:
    get:
      operationId: health
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Success
        "400":
          $ref: '#/components/responses/Error'
        "401":
